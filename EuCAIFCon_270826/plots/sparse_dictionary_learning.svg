<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="420" viewBox="0 0 650 420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Sparse dictionary learning network</title>
  <desc id="svg-desc">A fully connected three-five-three network with three polysemantic input neurons, five sparse hidden neurons, and three reconstructed output neurons. Concept colors appear only inside neurons; all connections are neutral.</desc>
  <defs>
    <style>
      .edge { stroke: #5f6368; stroke-width: 1.4; opacity: .52; stroke-linecap: round; }
      .node { stroke: #202124; stroke-width: 2.5; }
      .unknown { fill: none; stroke: #8a9096; stroke-width: 2.5; stroke-dasharray: 4 3; }
      .label { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3c4043; }
      .sub { font: 400 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6368; }
    </style>
    <linearGradient id="red-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/><stop offset="0.5" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#ff5a00"/><stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="orange-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a00"/><stop offset="0.5" stop-color="#ff5a00"/>
      <stop offset="0.5" stop-color="#ff9a00"/><stop offset="1" stop-color="#ff9a00"/>
    </linearGradient>
    <linearGradient id="three" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/><stop offset="0.333" stop-color="#ff0000"/>
      <stop offset="0.333" stop-color="#ff5a00"/><stop offset="0.666" stop-color="#ff5a00"/>
      <stop offset="0.666" stop-color="#ff9a00"/><stop offset="1" stop-color="#ff9a00"/>
    </linearGradient>
  </defs>

  <!-- Fully connected input-to-hidden layer: 3 × 5 -->
  <g>
    <line class="edge" x1="104" y1="90" x2="301" y2="50"/>
    <line class="edge" x1="104" y1="90" x2="301" y2="125"/>
    <line class="edge" x1="104" y1="90" x2="301" y2="200"/>
    <line class="edge" x1="104" y1="90" x2="301" y2="275"/>
    <line class="edge" x1="104" y1="90" x2="301" y2="350"/>

    <line class="edge" x1="104" y1="200" x2="301" y2="50"/>
    <line class="edge" x1="104" y1="200" x2="301" y2="125"/>
    <line class="edge" x1="104" y1="200" x2="301" y2="200"/>
    <line class="edge" x1="104" y1="200" x2="301" y2="275"/>
    <line class="edge" x1="104" y1="200" x2="301" y2="350"/>

    <line class="edge" x1="104" y1="310" x2="301" y2="50"/>
    <line class="edge" x1="104" y1="310" x2="301" y2="125"/>
    <line class="edge" x1="104" y1="310" x2="301" y2="200"/>
    <line class="edge" x1="104" y1="310" x2="301" y2="275"/>
    <line class="edge" x1="104" y1="310" x2="301" y2="350"/>
  </g>

  <!-- Fully connected hidden-to-output layer: 5 × 3 -->
  <g>
    <line class="edge" x1="349" y1="50" x2="546" y2="90"/>
    <line class="edge" x1="349" y1="50" x2="546" y2="200"/>
    <line class="edge" x1="349" y1="50" x2="546" y2="310"/>

    <line class="edge" x1="349" y1="125" x2="546" y2="90"/>
    <line class="edge" x1="349" y1="125" x2="546" y2="200"/>
    <line class="edge" x1="349" y1="125" x2="546" y2="310"/>

    <line class="edge" x1="349" y1="200" x2="546" y2="90"/>
    <line class="edge" x1="349" y1="200" x2="546" y2="200"/>
    <line class="edge" x1="349" y1="200" x2="546" y2="310"/>

    <line class="edge" x1="349" y1="275" x2="546" y2="90"/>
    <line class="edge" x1="349" y1="275" x2="546" y2="200"/>
    <line class="edge" x1="349" y1="275" x2="546" y2="310"/>

    <line class="edge" x1="349" y1="350" x2="546" y2="90"/>
    <line class="edge" x1="349" y1="350" x2="546" y2="200"/>
    <line class="edge" x1="349" y1="350" x2="546" y2="310"/>
  </g>

  <!-- Three input neurons -->
  <g>
    <circle cx="80" cy="90" r="24" fill="url(#red-orange)" class="node"/>
    <circle cx="80" cy="200" r="24" fill="url(#orange-amber)" class="node"/>
    <circle cx="80" cy="310" r="24" fill="url(#three)" class="node"/>
  </g>

  <!-- Five sparse hidden neurons -->
  <g>
    <circle cx="325" cy="50" r="24" fill="#ff0000" class="node"/>
    <circle cx="325" cy="125" r="24" fill="#ff5a00" class="node"/>
    <circle cx="325" cy="200" r="24" fill="#ff9a00" class="node"/>
    <circle cx="325" cy="275" r="24" fill="url(#red-orange)" class="node"/>
    <circle cx="325" cy="350" r="24" class="unknown"/>
  </g>

  <!-- Three output neurons -->
  <g>
    <circle cx="570" cy="90" r="24" fill="url(#red-orange)" class="node"/>
    <circle cx="570" cy="200" r="24" fill="url(#orange-amber)" class="node"/>
    <circle cx="570" cy="310" r="24" fill="url(#three)" class="node"/>
  </g>

  <g text-anchor="middle">
    <text x="80" y="390" class="label">Dense input</text>
    <text x="80" y="407" class="sub">polysemantic</text>
    <text x="325" y="390" class="label">Sparse latents</text>
    <text x="325" y="407" class="sub">one hidden layer</text>
    <text x="570" y="390" class="label">Reconstruction</text>
    <text x="570" y="407" class="sub">polysemantic</text>
  </g>
</svg>
